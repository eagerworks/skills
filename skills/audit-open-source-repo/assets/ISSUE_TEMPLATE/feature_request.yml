# Starter feature request form. Point Contributor Readiness Plan rows closing
# checks 5.1, 5.2 at this file — see references/dimensions.md.
# Save to .github/ISSUE_TEMPLATE/feature_request.yml.
name: Feature request
description: Propose something new before writing the code
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation today, and why it's worth fixing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see, in enough detail to discuss before it's built.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why this one seems better.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be able to work on this?
      options:
        - label: I'd like to submit a PR for this
          required: false
